<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — ResumeAI</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
  <!-- login.css supplies the shared auth-card layout -->
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/signup.css">
</head>
<body class="auth-page">

  <main>
    <!-- ============ SIGNUP CARD ============ -->
    <section class="auth-card signup-card">

      <div class="auth-head">
        <a href="index.html" class="logo">
          <span class="logo-mark"><i class="fa-solid fa-file-lines"></i></span>
          ResumeAI
        </a>
        <h1>Create Your Account</h1>
        <p>Start building ATS-friendly resumes for free</p>
      </div>

      <!-- Validation feedback is filled in by js/script.js -->
      <p class="form-message" id="signupMessage"></p>

      <form id="signupForm" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <div class="input-wrap">
              <i class="fa-solid fa-id-card"></i>
              <input type="text" id="fullname" name="fullname" placeholder="Your full name" required>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrap">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
          </div>
          <small class="field-hint">Use at least 6 characters.</small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock-open"></i>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
          </div>
        </div>

        <label class="terms-row">
          <input type="checkbox" id="terms">
          <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
        </label>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Create Account <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>

      <div class="auth-divider">OR</div>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </section>

    <a href="index.html" class="auth-back"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
  </main>

  <script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>

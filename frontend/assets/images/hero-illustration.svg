<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-label="Illustration of a resume being analysed by AI">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D1FAE5"/><stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10B981" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- background blobs -->
  <circle cx="66" cy="66" r="52" fill="#D1FAE5" opacity=".6"/>
  <circle cx="470" cy="330" r="66" fill="#D1FAE5" opacity=".7"/>

  <!-- resume sheet -->
  <g filter="url(#sh)">
    <rect x="96" y="40" width="240" height="320" rx="18" fill="#ffffff"/>
  </g>

  <!-- header block: avatar + name lines -->
  <circle cx="140" cy="86" r="20" fill="url(#g1)"/>
  <rect x="172" y="74" width="112" height="12" rx="6" fill="#131a2b" opacity=".85"/>
  <rect x="172" y="94" width="76" height="9" rx="4.5" fill="#aab2c8"/>

  <!-- section: experience -->
  <rect x="120" y="132" width="64" height="9" rx="4.5" fill="url(#g1)"/>
  <rect x="120" y="152" width="192" height="7" rx="3.5" fill="#e4e9f5"/>
  <rect x="120" y="167" width="168" height="7" rx="3.5" fill="#e4e9f5"/>
  <rect x="120" y="182" width="184" height="7" rx="3.5" fill="#e4e9f5"/>

  <!-- section: education -->
  <rect x="120" y="210" width="56" height="9" rx="4.5" fill="url(#g1)"/>
  <rect x="120" y="230" width="176" height="7" rx="3.5" fill="#e4e9f5"/>
  <rect x="120" y="245" width="150" height="7" rx="3.5" fill="#e4e9f5"/>

  <!-- section: skill pills -->
  <rect x="120" y="276" width="44" height="9" rx="4.5" fill="url(#g1)"/>
  <rect x="120" y="296" width="56" height="20" rx="10" fill="url(#g2)"/>
  <rect x="184" y="296" width="70" height="20" rx="10" fill="url(#g2)"/>
  <rect x="262" y="296" width="50" height="20" rx="10" fill="url(#g2)"/>
  <rect x="120" y="324" width="88" height="20" rx="10" fill="url(#g2)"/>
  <rect x="216" y="324" width="62" height="20" rx="10" fill="url(#g2)"/>

  <!-- floating ATS score card -->
  <g filter="url(#sh)">
    <rect x="300" y="96" width="168" height="122" rx="16" fill="#ffffff"/>
  </g>
  <text x="320" y="126" font-family="Poppins,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#131a2b">ATS Score</text>
  <circle cx="344" cy="172" r="26" fill="none" stroke="#e4e9f5" stroke-width="8"/>
  <circle cx="344" cy="172" r="26" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="134 164" transform="rotate(-90 344 172)"/>
  <text x="344" y="177" text-anchor="middle" font-family="Poppins,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#10B981">82</text>
  <rect x="386" y="150" width="64" height="7" rx="3.5" fill="#e4e9f5"/>
  <rect x="386" y="166" width="48" height="7" rx="3.5" fill="#e4e9f5"/>
  <rect x="386" y="182" width="58" height="7" rx="3.5" fill="#e4e9f5"/>

  <!-- floating AI badge -->
  <g filter="url(#sh)">
    <rect x="52" y="248" width="118" height="52" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="82" cy="274" r="15" fill="url(#g1)"/>
  <text x="82" y="279" text-anchor="middle" font-family="Poppins,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#ffffff">AI</text>
  <rect x="106" y="264" width="48" height="7" rx="3.5" fill="#131a2b" opacity=".8"/>
  <rect x="106" y="278" width="34" height="6" rx="3" fill="#aab2c8"/>
</svg>
